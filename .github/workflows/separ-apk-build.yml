name: Build SEPAR Android APK

on:
  push:
    branches:
      - separ-apk-build
    paths:
      - "separ-app/**"
      - ".github/workflows/separ-apk-build.yml"
  workflow_dispatch:

concurrency:
  group: separ-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate bundled offline Persian alert voices
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak espeak-data ffmpeg
          mkdir -p separ-app/app/src/main/assets
          printf 'توجه! هشدار حمله هوایی. فوراً به محل امن پناه ببرید.\\n' > /tmp/separ-alert-fa.txt
          espeak -v fa -s 170 -p 28 -a 190 -f /tmp/separ-alert-fa.txt -w /tmp/separ-male.wav
          espeak -v fa -s 170 -p 65 -a 190 -f /tmp/separ-alert-fa.txt -w /tmp/separ-female.wav
          ffmpeg -y -i /tmp/separ-male.wav -ac 1 -ar 16000 -c:a libmp3lame -b:a 24k separ-app/app/src/main/assets/voice_male.mp3
          ffmpeg -y -i /tmp/separ-female.wav -ac 1 -ar 16000 -c:a libmp3lame -b:a 24k separ-app/app/src/main/assets/voice_female.mp3
          test -s separ-app/app/src/main/assets/voice_male.mp3
          test -s separ-app/app/src/main/assets/voice_female.mp3

      - name: Run airspace policy unit tests
        run: gradle --no-daemon --stacktrace -p separ-app :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p separ-app :app:assembleDebug

      - name: Verify and checksum APK
        run: |
          test -s separ-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum separ-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SEPAR-debug-APK
          path: separ-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
